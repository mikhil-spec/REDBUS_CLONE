<h2 mat-dialog-title class="text-xl font-bold text-gray-800">Available Bus Routes</h2>

<mat-dialog-content class="mat-typography my-4">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 w-full">

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> S.No. </th>
      <td mat-cell *matCellDef="let element"> {{ element.position }} </td>
    </ng-container>

    <!-- From Column -->
    <ng-container matColumnDef="from">
      <th mat-header-cell *matHeaderCellDef> From </th>
      <td mat-cell *matCellDef="let element"> {{ element.from }} </td>
    </ng-container>

    <!-- To Column -->
    <ng-container matColumnDef="to">
      <th mat-header-cell *matHeaderCellDef> To </th>
      <td mat-cell *matCellDef="let element"> {{ element.to }} </td>
    </ng-container>

    <!-- Buses Count Column -->
    <ng-container matColumnDef="nobus">
      <th mat-header-cell *matHeaderCellDef> No. of Buses </th>
      <td mat-cell *matCellDef="let element"> {{ element.nobus }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close color="primary">Close</button>
</mat-dialog-actions>
