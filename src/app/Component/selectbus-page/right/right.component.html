<div class="right-container w-full">
  <app-sorting-bar></app-sorting-bar>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-red-500"></div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && matchedBuses.length === 0" class="bg-white p-8 rounded-xl border border-gray-200 shadow-sm text-center my-4">
    <mat-icon class="text-gray-400 text-5xl h-12 w-12 mb-2">directions_bus</mat-icon>
    <h3 class="text-lg font-bold text-gray-700">No Buses Found</h3>
    <p class="text-sm text-gray-500">There are no matching buses available for this route and date.</p>
  </div>

  <!-- Bus Cards List -->
  <div *ngIf="!isLoading && matchedBuses.length > 0" class="bus-list flex flex-col gap-4 mt-4">
    <div *ngFor="let bus of matchedBuses">
      <app-bus-box 
        [rating]="bus.rating" 
        [busid]="bus._id || ''" 
        [operatorname]="bus.operatorName" 
        [bustype]="bus.busType"
        [departuretime]="bus.departureTime" 
        [livetracking]="bus.liveTracking" 
        [reschedulable]="bus.reschedulable" 
        [filledseats]="getFilledSeats(bus._id)"
        [routedetails]="routesDetails">
      </app-bus-box>
    </div>
  </div>
</div>
